name: ZPTA offline research tests

on:
  pull_request:
    paths:
      - "analysis/zpta_*.py"
      - "tests/test_zpta_*.py"
      - ".github/workflows/zpta-research-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zpta-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline ZPTA deterministic tests (no broker credentials)
        run: python -m unittest discover -s tests -p "test_zpta_*.py" -v

  candidate-daily-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Attempt unverified public daily history retrieval (no secrets)
        id: fetch
        continue-on-error: true
        run: |
          python analysis/zpta_daily_history_fetch.py --range 2y --min-sessions 130 --output "$RUNNER_TEMP/zpta_daily.csv" --metadata "$RUNNER_TEMP/zpta_meta.json"
      - name: Analyze candidate data without asserting split verification
        if: steps.fetch.outcome == 'success'
        run: |
          python -m analysis.zpta_daily_swing_research "$RUNNER_TEMP/zpta_daily.csv" --source "Yahoo delayed daily OHLCV; adjustment UNVERIFIED" --output "$RUNNER_TEMP/zpta_report.json"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          meta = json.loads((root / "zpta_meta.json").read_text())
          report = json.loads((root / "zpta_report.json").read_text())
          print("CANDIDATE_SOURCE_METADATA:", json.dumps(meta, sort_keys=True))
          print("RESEARCH_VALIDATION_GATE:", json.dumps(report["validation_gate"], sort_keys=True))
          print("ELIGIBLE_FOR_MODEL_SELECTION:", report["eligible_for_model_selection"])
          for name, horizon in report["signal_results"].items():
              print("SIGNAL:", name, "3d", json.dumps(horizon["3d"], sort_keys=True))
          from analysis.zpta_intraday_recovery import load_daily
          from analysis.zpta_daily_robustness import evaluate_holdout
          bars = load_daily(root / "zpta_daily.csv")
          independent = evaluate_holdout(bars)
          for name, horizons in independent["results"].items():
              for h in ("1d", "3d", "5d"):
                  print("HOLDOUT_NONOVERLAP:", name, h, json.dumps(horizons[h], sort_keys=True))
          # A few publicly displayed S&P/Quiver dates are sanity anchors only,
          # NOT complete independent provider verification.
          anchors = {
              "2026-10-23": (.75, 19451),
              "2026-10-22": (.72, 39626),
              "2026-10-16": (.67, 798918),
              "2026-10-08": (.5525, 376404),
              "2026-08-25": (.8631, 226792),
          }
          lookup = {b["date"]: b for b in bars}
          for day, (expected_close, expected_volume) in anchors.items():
              b = lookup.get(day)
              if not b:
                  print("ANCHOR_MISSING:", day)
                  continue
              close_error = abs(b["close"]/expected_close-1)*100
              volume_error = abs(b["volume"]/expected_volume-1)*100
              print("CROSS_PROVIDER_ANCHOR:", day,
                    json.dumps({"yahoo_close": b["close"], "reference_close": expected_close,
                                "close_difference_pct": round(close_error,3),
                                "yahoo_volume": b["volume"], "reference_volume": expected_volume,
                                "volume_difference_pct": round(volume_error,3)}, sort_keys=True))
          PY
      - name: Explicitly mark provider fetch failure
        if: steps.fetch.outcome != 'success'
        run: echo "Candidate data fetch failed; deterministic tests are separate. No verified daily dataset or strategy performance produced."
