name: Release gate verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify fail-closed release gate
        run: python -m unittest -v test_release_gate
