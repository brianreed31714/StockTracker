name: Infrastructure registry contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal local agent dependencies
        run: python -m pip install requests python-dotenv
      - name: Registry, safety invariants, dependency graph
        run: |
          python -m infrastructure.registry_contract
          python -m unittest -v infrastructure.test_registry_contract infrastructure.test_runtime_inventory infrastructure.test_agent_preflight infrastructure.test_task_registration infrastructure.test_script_version
      - name: Detect unmapped changed Python modules
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          from infrastructure.registry_contract import validate_registry, change_impact
          root = pathlib.Path.cwd()
          reg = validate_registry(root)
          result = subprocess.run(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'],
                                  capture_output=True, text=True)
          if result.returncode != 0:
              raise SystemExit('Cannot establish change scope; fail closed')
          impact = change_impact(reg, result.stdout.splitlines())
          print('Impact / verification plan:', impact)
          if impact['unmapped_python_files']:
              raise SystemExit('Python change with no registered infrastructure owner')
          PY
      - name: Verify all release-component script families
        run: |
          python - <<'PY'
          from pathlib import Path
          from infrastructure.registry_contract import validate_registry, release_preflight
          root = Path.cwd()
          reg = validate_registry(root)
          for component in reg["components"]:
              if component.get("deployment_component"):
                  release_preflight(root, [component["id"]], {component["id"]: component["entrypoint"]})
                  print("PASS release contract:", component["id"])
          PY

  contract-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal local agent dependencies
        run: python -m pip install requests python-dotenv
      - name: Test Windows-compatible registry enforcement
        shell: pwsh
        run: |
          python -m infrastructure.registry_contract
          if ($LASTEXITCODE -ne 0) { throw "Registry validation failed" }
          python -m unittest -v infrastructure.test_registry_contract infrastructure.test_runtime_inventory infrastructure.test_agent_preflight infrastructure.test_task_registration infrastructure.test_script_version
          if ($LASTEXITCODE -ne 0) { throw "Registry negative tests failed" }
      - name: Real Windows CIM discovery and project process isolation
        shell: pwsh
        run: |
          python -m unittest -v infrastructure.test_windows_integration test_project_process_control
          if ($LASTEXITCODE -ne 0) { throw "Windows process integration failed" }
      - name: PowerShell host audit syntax (does not execute)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("infrastructure/audit_both_projects.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Compile deployable modules without imports or side effects
        shell: pwsh
        run: |
          python -m py_compile infrastructure/registry_contract.py infrastructure/runtime_inventory.py
          if ($LASTEXITCODE -ne 0) { throw "Registry compile failed" }
