name: StockTracker report freshness audit tests

on:
  pull_request:
    paths:
      - "analysis/report_freshness_audit.py"
      - "tests/test_report_freshness_audit.py"
      - ".github/workflows/report-freshness-audit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-freshness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline EOD evidence integrity tests (no broker credentials)
        run: python -m unittest discover -s tests -p "test_report_freshness_audit.py" -v
